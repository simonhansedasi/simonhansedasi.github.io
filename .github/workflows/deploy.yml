name: Redirect to simonhansedasi.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Create redirect site
        run: |
          mkdir _site
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0; url=https://simonhansedasi.com">
            <script>window.location.replace("https://simonhansedasi.com" + window.location.pathname + window.location.search);</script>
          </head>
          <body>
            <p>Redirecting to <a href="https://simonhansedasi.com">simonhansedasi.com</a>...</p>
          </body>
          </html>
          EOF
          cp _site/index.html _site/404.html

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deployment
